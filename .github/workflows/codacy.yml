# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '42 17 * * 5'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # 562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # GitHub code scanning no longer accepts multiple SARIF runs that share the
      # same tool/category in one upload (see
      # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/).
      # The Codacy CLI emits one run per analysed tool execution, so merge runs
      # that share the same tool *and* category into a single run before
      # uploading. Runs with distinct categories are kept apart. Results that
      # reference their rule only by index are given the rule id first, since
      # indexes are not stable once rule lists are merged; likewise
      # artifactLocation indexes (offsets into each run's own artifacts list)
      # are dropped in favour of the uri, and the per-run artifacts list with them.
      - name: Merge duplicate SARIF runs
        run: |
          jq '
            .runs = (
              .runs
              | group_by([.tool.driver.name, (.automationDetails.id // "")])
              | map(
                  . as $group
                  | $group[0]
                  | .tool.driver.rules = ([$group[].tool.driver.rules[]?] | unique_by(.id))
                  | .results = ([
                      $group[]
                      | . as $run
                      | .results[]?
                      | if (.ruleId == null and .ruleIndex != null)
                        then .ruleId = $run.tool.driver.rules[.ruleIndex].id
                        else . end
                      | del(.ruleIndex)
                      | del(.locations[]?.physicalLocation.artifactLocation.index)
                      | del(.relatedLocations[]?.physicalLocation.artifactLocation.index)
                    ])
                  | del(.artifacts)
                )
            )
          ' results.sarif > results.merged.sarif
          mv results.merged.sarif results.sarif
          jq -r ".runs | length | \"SARIF runs after merge: \\(.)\"" results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: results.sarif
